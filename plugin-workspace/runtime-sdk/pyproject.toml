[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asapflow-plugins-sdk"
version = "0.1.0"
description = "Standalone local development SDK for AsapFlow backend plugins"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["plugins_sdk*", "asap_runtime*"]
