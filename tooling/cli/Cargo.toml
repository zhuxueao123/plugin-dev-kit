[package]
name = "asapflow-cli"
version = "0.1.0"
edition = "2021"
description = "Unified CLI for AsapFlow capabilities"

[[bin]]
name = "asapflow"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
